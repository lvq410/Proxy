#  auth:
#    # 引用下方 auth.authors 中声明的认证器id；不配置则该端口不认证
#    # 客户端通过 pws://用户名:凭据@host:port 携带凭据，无需额外配置
#    # 注意：basic认证的凭据仅base64编码而非加密，开启认证时应确保处于TLS之后
#    #      (客户端用pwss://，或由反向代理终结TLS)，否则凭据在链路上是明文的
#    authorId: local-token

# 认证相关配置
auth:
  # 各认证器配置，由使用方(如pws)通过 authorId 引用
  authors:
  # 本地token认证：凭据存于本地文件，可通过管理界面维护
  # 管理界面地址 http://<host>:<server.port>/author.html
  # 需同时配置 spring.main.web-application-type: servlet 才会启用管理界面
  # 首次启动会生成管理员token并打印在日志中
#  - id: local-token
#    type: LocalToken
#    args:
#      userStore: data/users.json
  # ldap认证：向ldap服务校验用户名密码
#  - id: my-ldap
#    type: Ldap
#    args:
#      url: ldap://ldap.example.com:389
#      baseDn: ou=people,dc=example,dc=com
#      bindDn: cn=readonly,dc=example,dc=com
#      bindPassword: readonly-password
#      # 搜索用户的过滤器，{0}会被替换为待认证的用户名，默认 (uid={0})
#      userFilter: (uid={0})
#      # 认证通过结果的缓存时长(毫秒)，默认5分钟，配0则不缓存
#      cacheMillis: 300000